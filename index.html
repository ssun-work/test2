<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지자체 신청 심사 결과 및 집계</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 40px 20px;
      margin: 0;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 14px;
    }

    /* 테이블 스타일 */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.95rem;
    }

    thead th {
      background-color: #f8fafc;
      color: #475569;
      font-weight: 600;
      padding: 14px 16px;
      border-top: 1px solid #e2e8f0;
      border-bottom: 2px solid #cbd5e1;
    }

    tbody td {
      padding: 13px 16px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }

    tbody tr:hover {
      background-color: #f8fafc;
    }

    .text-right {
      text-align: right;
    }

    /* 뱃지 스타일 */
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .badge-approve {
      background-color: #dcfce7;
      color: #15803d;
    }

    .badge-reject {
      background-color: #fee2e2;
      color: #b91c1c;
    }

    /* 하단 통계/요약 카드 섹션 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 28px;
    }

    .summary-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 18px 20px;
      text-align: center;
    }

    .summary-card .label {
      font-size: 0.88rem;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .summary-card .value {
      font-size: 1.45rem;
      font-weight: 700;
    }

    .val-approve { color: #16a34a; }
    .val-reject { color: #dc2626; }
    .val-total { color: #2563eb; }
  </style>
</head>
<body>

  <div class="container">
    <h2>지자체 신청 심사 결과</h2>
    <table>
      <thead>
        <tr>
          <th>지자체명</th>
          <th>인구수</th>
          <th>신청액</th>
          <th>한도액</th>
          <th>판정</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- 자바스크립트가 데이터를 동적으로 생성합니다 -->
      </tbody>
    </table>

    <!-- 하단 통계 집계 영역 -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="label">승인 건수</div>
        <div class="value val-approve" id="approve-count">0건</div>
      </div>
      <div class="summary-card">
        <div class="label">반려 건수</div>
        <div class="value val-reject" id="reject-count">0건</div>
      </div>
      <div class="summary-card">
        <div class="label">승인신청액 합계</div>
        <div class="value val-total" id="approved-total-amount">0원</div>
      </div>
    </div>
  </div>

  <script>
    // 첨부된 신청목록_2.json 데이터
    const rawData = [
      { "지자체명": "가람군", "인구수": 30000, "신청액": 250000 },
      { "지자체명": "나봄시", "인구수": 45000, "신청액": 500000 },
      { "지자체명": "다솔구", "인구수": 80000, "신청액": 600000 },
      { "지자체명": "라윤시", "인구수": 60000, "신청액": 700000 },
      { "지자체명": "마을군", "인구수": 25000, "신청액": 200000 },
      { "지자체명": "바람시", "인구수": 100000, "신청액": 950000 },
      { "지자체명": "사계구", "인구수": 55000, "신청액": 600000 },
      { "지자체명": "아현시", "인구수": 70000, "신청액": 650000 },
      { "지자체명": "자연군", "인구수": 40000, "신청액": 380000 },
      { "지자체명": "차돌시", "인구수": 90000, "신청액": 880000 }
    ];

    const tbody = document.getElementById('table-body');
    let approveCount = 0;
    let rejectCount = 0;
    let approvedTotalAmount = 0;

    rawData.forEach(item => {
      // 한도액 = 인구수 * 10
      const limit = item.인구수 * 10;
      
      // 판정: 신청액이 한도액 이하이면 승인, 초과이면 반려
      const isApproved = item.신청액 <= limit;
      const status = isApproved ? '승인' : '반려';
      const badgeClass = isApproved ? 'badge-approve' : 'badge-reject';

      // 집계 통계 계산
      if (isApproved) {
        approveCount += 1;
        approvedTotalAmount += item.신청액;
      } else {
        rejectCount += 1;
      }

      // 테이블 행(tr) 렌더링
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${item.지자체명}</strong></td>
        <td class="text-right">${item.인구수.toLocaleString()}명</td>
        <td class="text-right">${item.신청액.toLocaleString()}원</td>
        <td class="text-right">${limit.toLocaleString()}원</td>
        <td><span class="badge ${badgeClass}">${status}</span></td>
      `;
      tbody.appendChild(tr);
    });

    // 하단 집계 영역 값 바인딩
    document.getElementById('approve-count').textContent = `${approveCount.toLocaleString()}건`;
    document.getElementById('reject-count').textContent = `${rejectCount.toLocaleString()}건`;
    document.getElementById('approved-total-amount').textContent = `${approvedTotalAmount.toLocaleString()}원`;
  </script>
</body>
</html>
