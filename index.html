<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지자체 신청 심사 결과 목록</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 40px 20px;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.95rem;
    }

    thead th {
      background-color: #f1f5f9;
      color: #475569;
      font-weight: 600;
      padding: 14px 16px;
      border-bottom: 2px solid #cbd5e1;
    }

    tbody td {
      padding: 14px 16px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: middle;
    }

    tbody tr:hover {
      background-color: #f8fafc;
    }

    .text-right {
      text-align: right;
    }

    /* 판정 뱃지 스타일 */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .badge-approve {
      background-color: #dcfce7;
      color: #15803d;
    }

    .badge-reject {
      background-color: #fee2e2;
      color: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>지자체 신청 심사 결과</h2>
    <table>
      <thead>
        <tr>
          <th>지자체명</th>
          <th>인구수</th>
          <th>신청액</th>
          <th>한도액</th>
          <th>판정</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- 자바스크립트에 의해 데이터가 동적으로 렌더링됩니다 -->
      </tbody>
    </table>
  </div>

  <script>
    // 첨부된 신청목록.json 데이터
    const rawData = [
      { "지자체명": "가람군", "인구수": 30000, "신청액": 250000 },
      { "지자체명": "나봄시", "인구수": 45000, "신청액": 500000 },
      { "지자체명": "다솔구", "인구수": 80000, "신청액": 600000 },
      { "지자체명": "라윤시", "인구수": 60000, "신청액": 700000 },
      { "지자체명": "마을군", "인구수": 25000, "신청액": 200000 },
      { "지자체명": "바람시", "인구수": 100000, "신청액": 950000 },
      { "사계구": "사계구", "지자체명": "사계구", "인구수": 55000, "신청액": 600000 },
      { "지자체명": "아현시", "인구수": 70000, "신청액": 650000 },
      { "지자체명": "자연군", "인구수": 40000, "신청액": 380000 },
      { "지자체명": "차돌시", "인구수": 90000, "신청액": 880000 }
    ];

    const tbody = document.getElementById('table-body');

    rawData.forEach(item => {
      // 한도액 = 인구수 * 10
      const limit = item.인구수 * 10;
      
      // 판정: 신청액 > 한도액이면 반려, 같거나 작으면 승인
      const isApproved = item.신청액 <= limit;
      const status = isApproved ? '승인' : '반려';
      const badgeClass = isApproved ? 'badge-approve' : 'badge-reject';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${item.지자체명}</strong></td>
        <td class="text-right">${item.인구수.toLocaleString()}명</td>
        <td class="text-right">${item.신청액.toLocaleString()}원</td>
        <td class="text-right">${limit.toLocaleString()}원</td>
        <td><span class="badge ${badgeClass}">${status}</span></td>
      `;
      tbody.appendChild(tr);
    });
  </script>
</body>
</html>
